name: Feature request
description: Suggest an improvement that keeps the extension local and respectful of site controls.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Requests to bypass CAPTCHA, Cloudflare, rate limits, order limits, or other reservation-site protections will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
