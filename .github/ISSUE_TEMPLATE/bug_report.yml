name: Bug report
description: Report a reproducible problem with the extension.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include reservation references, names, contact details, screenshots containing personal information, cookies, session data, or Cloudflare/CAPTCHA details. This project does not support bypassing site protections or reservation limits.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: The version shown in Chrome's extension details.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include only redacted diagnostics and non-sensitive reproduction steps.
    validations:
      required: true
